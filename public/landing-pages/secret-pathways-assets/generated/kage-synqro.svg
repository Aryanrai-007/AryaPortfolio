<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="synq-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#051622"/>
      <stop offset="50%" stop-color="#071d2b"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <linearGradient id="synq-logo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="cyan-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(11, 32, 48, 0.95)"/>
      <stop offset="100%" stop-color="rgba(4, 14, 22, 0.98)"/>
    </linearGradient>
    <linearGradient id="chart-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 198, 255, 0.5)"/>
      <stop offset="100%" stop-color="rgba(0, 198, 255, 0)"/>
    </linearGradient>
    <filter id="cyan-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#synq-bg)"/>

  <!-- Tech Grid Lines -->
  <path d="M 0 80 H1280 M 0 160 H1280 M 0 240 H1280 M 0 320 H1280 M 0 400 H1280 M 0 480 H1280 M 0 560 H1280 M 0 640 H1280" stroke="rgba(0, 198, 255, 0.05)" stroke-width="1"/>
  <path d="M 160 0 V720 M 320 0 V720 M 480 0 V720 M 640 0 V720 M 800 0 V720 M 960 0 V720 M 1120 0 V720" stroke="rgba(0, 198, 255, 0.05)" stroke-width="1"/>

  <!-- Top Title Branding Header -->
  <g transform="translate(45, 35)">
    <!-- Logo Icon -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#00c6ff" stroke-width="3" filter="url(#cyan-glow)"/>
    <path d="M 12 12 Q 20 28 28 12" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="50" y="32" fill="url(#synq-logo-grad)" font-family="system-ui, sans-serif" font-size="48" font-weight="900" letter-spacing="5">SYNQRO</text>

    <text x="0" y="60" fill="#00c6ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3">SMART QUEUES · SMOOTHER EXPERIENCES</text>
    <text x="0" y="85" fill="#a0b0b8" font-family="system-ui" font-size="12" font-weight="300">An AI-powered queue management platform that predicts, manages, and optimizes</text>
    <text x="0" y="103" fill="#a0b0b8" font-family="system-ui" font-size="12" font-weight="300">waiting experiences in real-time.</text>

    <!-- CTAs & Feature Chips -->
    <rect x="0" y="122" width="125" height="34" rx="6" fill="#00c6ff" filter="url(#cyan-glow)"/>
    <text x="62" y="143" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">VIEW DEMO →</text>

    <rect x="138" y="122" width="105" height="34" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="190" y="143" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">GITHUB</text>

    <g transform="translate(0, 175)">
      <text x="0" y="12" fill="#78837c" font-family="monospace" font-size="10">PREDICT</text>
      <text x="110" y="12" fill="#78837c" font-family="monospace" font-size="10">MANAGE</text>
      <text x="210" y="12" fill="#78837c" font-family="monospace" font-size="10">INFORM</text>
      <text x="300" y="12" fill="#78837c" font-family="monospace" font-size="10">OPTIMIZE</text>
    </g>
  </g>

  <!-- Overhead Counter Display Monitor Bar Row (Top Right) -->
  <g transform="translate(580, 40)">
    <rect x="0" y="0" width="145" height="75" rx="8" fill="#071826" stroke="#30d158" stroke-width="1.5"/>
    <text x="15" y="24" fill="#78837c" font-family="monospace" font-size="10">COUNTER A</text>
    <text x="15" y="55" fill="#30d158" font-family="system-ui" font-size="24" font-weight="bold">3 min</text>

    <rect x="160" y="0" width="145" height="75" rx="8" fill="#071826" stroke="#ff9f0a" stroke-width="1.5"/>
    <text x="175" y="24" fill="#78837c" font-family="monospace" font-size="10">COUNTER B</text>
    <text x="175" y="55" fill="#ff9f0a" font-family="system-ui" font-size="24" font-weight="bold">12 min</text>

    <rect x="320" y="0" width="145" height="75" rx="8" fill="#071826" stroke="#30d158" stroke-width="1.5"/>
    <text x="335" y="24" fill="#78837c" font-family="monospace" font-size="10">COUNTER C</text>
    <text x="335" y="55" fill="#30d158" font-family="system-ui" font-size="24" font-weight="bold">5 min</text>

    <rect x="480" y="0" width="145" height="75" rx="8" fill="#071826" stroke="#ff453a" stroke-width="1.5"/>
    <text x="495" y="24" fill="#78837c" font-family="monospace" font-size="10">COUNTER D</text>
    <text x="495" y="55" fill="#ff453a" font-family="system-ui" font-size="24" font-weight="bold">18 min</text>
  </g>

  <!-- Live Queue Dashboard Center Panel -->
  <g transform="translate(45, 400)">
    <rect x="0" y="0" width="820" height="280" rx="12" fill="url(#cyan-panel)" stroke="rgba(0, 198, 255, 0.35)" stroke-width="1.5"/>
    <rect x="0" y="0" width="820" height="38" rx="12" fill="rgba(0, 198, 255, 0.08)"/>

    <text x="20" y="24" fill="#00c6ff" font-family="monospace" font-size="12" font-weight="bold">SYNQRO / Live Overview Dashboard</text>
    <text x="730" y="24" fill="#30d158" font-family="monospace" font-size="10">● LIVE MONITOR</text>

    <!-- Top Stats Row -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="240" height="75" rx="8" fill="#06131f" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="24" fill="#78837c" font-family="monospace" font-size="10">TOTAL PEOPLE IN QUEUE</text>
      <text x="20" y="58" fill="#00c6ff" font-family="system-ui" font-size="28" font-weight="bold">48</text>
      <text x="80" y="56" fill="#30d158" font-family="monospace" font-size="11">↓ 12% optimal</text>

      <rect x="260" y="0" width="240" height="75" rx="8" fill="#06131f" stroke="rgba(255,255,255,0.06)"/>
      <text x="280" y="24" fill="#78837c" font-family="monospace" font-size="10">AVG WAIT TIME</text>
      <text x="280" y="58" fill="#ffffff" font-family="system-ui" font-size="28" font-weight="bold">8 min</text>
      <text x="365" y="56" fill="#30d158" font-family="monospace" font-size="11">↓ 20% faster</text>

      <rect x="520" y="0" width="260" height="75" rx="8" fill="#06131f" stroke="rgba(255,255,255,0.06)"/>
      <text x="540" y="24" fill="#78837c" font-family="monospace" font-size="10">SERVICE EFFICIENCY</text>
      <text x="540" y="58" fill="#30d158" font-family="system-ui" font-size="28" font-weight="bold">87%</text>
      <text x="620" y="56" fill="#30d158" font-family="monospace" font-size="11">↑ 14% peak</text>
    </g>

    <!-- Queue Prediction Line Chart -->
    <g transform="translate(20, 140)">
      <text x="0" y="16" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="600">Queue Prediction (Next 1 Hour)</text>

      <path d="M 0 110 H 780 M 0 70 H 780 M 0 30 H 780" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

      <path d="M 0 110 C 150 90, 220 30, 320 60 T 480 40 T 640 90 T 780 70" fill="none" stroke="#00c6ff" stroke-width="3" filter="url(#cyan-glow)"/>
      <path d="M 0 110 C 150 90, 220 30, 320 60 T 480 40 T 640 90 T 780 70 L 780 120 L 0 120 Z" fill="url(#chart-cyan)"/>

      <circle cx="320" cy="60" r="5" fill="#ff9f0a"/>
      <rect x="250" y="15" width="140" height="28" rx="4" fill="#081826" stroke="#ff9f0a"/>
      <text x="320" y="33" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">Peak: 42 people in 25m</text>
    </g>
  </g>

  <!-- Right Side Process Stepper Panel -->
  <g transform="translate(900, 200)">
    <rect x="0" y="0" width="335" height="480" rx="12" fill="url(#cyan-panel)" stroke="rgba(223, 231, 224, 0.12)"/>
    <text x="25" y="35" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">HOW IT WORKS</text>

    <!-- Step 1 -->
    <g transform="translate(25, 60)">
      <circle cx="18" cy="18" r="18" fill="rgba(0,198,255,0.15)" stroke="#00c6ff"/>
      <text x="18" y="23" fill="#00c6ff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">01</text>
      <text x="52" y="15" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold">COLLECT</text>
      <text x="52" y="32" fill="#78837c" font-family="system-ui" font-size="10.5">Real-time queue data from sensors or APIs</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(25, 140)">
      <circle cx="18" cy="18" r="18" fill="rgba(0,198,255,0.15)" stroke="#00c6ff"/>
      <text x="18" y="23" fill="#00c6ff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">02</text>
      <text x="52" y="15" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold">ANALYZE</text>
      <text x="52" y="32" fill="#78837c" font-family="system-ui" font-size="10.5">AI predicts wait times &amp; detects congestion</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(25, 220)">
      <circle cx="18" cy="18" r="18" fill="rgba(0,198,255,0.15)" stroke="#00c6ff"/>
      <text x="18" y="23" fill="#00c6ff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">03</text>
      <text x="52" y="15" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold">OPTIMIZE</text>
      <text x="52" y="32" fill="#78837c" font-family="system-ui" font-size="10.5">Dynamically allocate resources &amp; routing</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(25, 300)">
      <circle cx="18" cy="18" r="18" fill="rgba(0,198,255,0.15)" stroke="#00c6ff"/>
      <text x="18" y="23" fill="#00c6ff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">04</text>
      <text x="52" y="15" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold">INFORM</text>
      <text x="52" y="32" fill="#78837c" font-family="system-ui" font-size="10.5">Provide live mobile updates to users &amp; staff</text>
    </g>

    <rect x="25" y="390" width="285" height="60" rx="6" fill="#05131f" stroke="rgba(0,198,255,0.25)"/>
    <text x="167" y="425" fill="#00c6ff" font-family="monospace" font-size="11" text-anchor="middle">"TURNING WAITING INTO A BETTER EXPERIENCE."</text>
  </g>
</svg>
