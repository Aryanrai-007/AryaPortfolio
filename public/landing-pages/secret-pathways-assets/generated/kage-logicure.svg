<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="logi-bg" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#1c0b0e"/>
      <stop offset="35%" stop-color="#0f1622"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>
    <linearGradient id="logi-logo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#e0231c"/>
    </linearGradient>
    <linearGradient id="glass-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 18, 26, 0.95)"/>
      <stop offset="100%" stop-color="rgba(5, 8, 12, 0.98)"/>
    </linearGradient>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#logi-bg)"/>

  <!-- Horizon & City Harbor Lights -->
  <path d="M 0 440 Q 640 460 1280 440 V 720 H 0 Z" fill="#040910"/>
  <!-- Water Reflection Highlights -->
  <ellipse cx="800" cy="560" rx="300" ry="80" fill="rgba(255, 107, 0, 0.12)" filter="url(#glow-orange)"/>
  <ellipse cx="600" cy="520" rx="400" ry="40" fill="rgba(224, 35, 28, 0.08)"/>

  <!-- Ship & Crane Silhouettes -->
  <path d="M 820 440 L 850 410 L 1080 410 L 1120 440 Z" fill="#081018" stroke="#ff6b00" stroke-width="1"/>
  <rect x="870" y="380" width="40" height="30" fill="#e0231c" opacity="0.6"/>
  <rect x="920" y="380" width="50" height="30" fill="#ff6b00" opacity="0.6"/>
  <rect x="980" y="380" width="40" height="30" fill="#202c38"/>

  <path d="M 980 440 L 1020 310 L 1100 310 M 1020 310 L 1010 440" fill="none" stroke="rgba(255, 107, 0, 0.6)" stroke-width="2"/>
  <path d="M 1120 440 L 1150 290 L 1240 290" fill="none" stroke="rgba(224, 35, 28, 0.6)" stroke-width="2"/>

  <!-- Giant Wireframe Globe -->
  <circle cx="620" cy="220" r="230" fill="none" stroke="rgba(255, 107, 0, 0.2)" stroke-width="1.5"/>
  <ellipse cx="620" cy="220" rx="230" ry="90" fill="none" stroke="rgba(255, 107, 0, 0.25)" stroke-width="1" stroke-dasharray="5 5"/>
  <ellipse cx="620" cy="220" rx="100" ry="230" fill="none" stroke="rgba(255, 107, 0, 0.2)" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- Glowing Disruption Routes -->
  <path d="M 450 240 Q 560 120 720 180 T 900 210" fill="none" stroke="#ff3b30" stroke-width="3" filter="url(#glow-orange)"/>
  <path d="M 520 300 Q 640 340 800 270" fill="none" stroke="#ff9f0a" stroke-width="2.5" stroke-dasharray="8 4" filter="url(#glow-orange)"/>

  <!-- Disruption Callout Badges -->
  <circle cx="560" cy="180" r="8" fill="#ff3b30" filter="url(#glow-orange)"/>
  <rect x="520" y="125" width="150" height="36" rx="4" fill="rgba(10, 15, 22, 0.92)" stroke="#ff3b30" stroke-width="1.5"/>
  <text x="530" y="141" fill="#ff3b30" font-family="monospace" font-size="10" font-weight="bold">⚠️ POLITICAL RISK</text>
  <text x="530" y="153" fill="#dfe7e0" font-family="system-ui" font-size="9">Port disruption risk increased</text>

  <circle cx="720" cy="180" r="8" fill="#ff9f0a" filter="url(#glow-orange)"/>
  <rect x="700" y="125" width="150" height="36" rx="4" fill="rgba(10, 15, 22, 0.92)" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="710" y="141" fill="#ff9f0a" font-family="monospace" font-size="10" font-weight="bold">⚡ CLIMATE EVENT</text>
  <text x="710" y="153" fill="#dfe7e0" font-family="system-ui" font-size="9">Cyclone high impact zone</text>

  <!-- Top Title Branding Header -->
  <g transform="translate(45, 35)">
    <!-- Logo Icon -->
    <path d="M 0 35 L 20 0 L 40 35 Z" fill="none" stroke="#ff6b00" stroke-width="4" filter="url(#glow-orange)"/>
    <path d="M 12 25 L 20 10 L 28 25 Z" fill="#ff6b00"/>
    <text x="52" y="32" fill="url(#logi-logo-grad)" font-family="system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="5">LOGICURE</text>

    <text x="0" y="60" fill="#dfe7e0" font-family="monospace" font-size="12" font-weight="700" letter-spacing="3">ANTICIPATE · ADAPT · STAY AHEAD</text>
    <text x="0" y="85" fill="#a0aab0" font-family="system-ui" font-size="12" font-weight="300">An AI-powered decision support system that helps organizations sense disruptions,</text>
    <text x="0" y="103" fill="#a0aab0" font-family="system-ui" font-size="12" font-weight="300">understand their impact, simulate outcomes, and take proactive action.</text>

    <!-- CTAs -->
    <rect x="0" y="122" width="135" height="34" rx="6" fill="#ff6b00" filter="url(#glow-orange)"/>
    <text x="67" y="143" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">EXPLORE DEMO →</text>

    <rect x="148" y="122" width="115" height="34" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="205" y="143" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">VIEW GITHUB</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 175)">
      <text x="0" y="12" fill="#78837c" font-family="monospace" font-size="10">REAL-TIME DATA</text>
      <text x="130" y="12" fill="#78837c" font-family="monospace" font-size="10">AI AGENTS</text>
      <text x="240" y="12" fill="#78837c" font-family="monospace" font-size="10">RISK FORECASTING</text>
      <text x="380" y="12" fill="#78837c" font-family="monospace" font-size="10">SCENARIO SIMULATION</text>
    </g>
  </g>

  <!-- Bottom Left Dashboard Overlay -->
  <g transform="translate(45, 400)">
    <rect x="0" y="0" width="540" height="280" rx="12" fill="url(#glass-dark)" stroke="rgba(255, 107, 0, 0.35)" stroke-width="1.5"/>
    <rect x="0" y="0" width="540" height="38" rx="12" fill="rgba(255, 107, 0, 0.08)"/>

    <text x="20" y="24" fill="#ff6b00" font-family="monospace" font-size="12" font-weight="bold">LOGICURE / Global Risk Overview</text>
    <text x="450" y="24" fill="#30d158" font-family="monospace" font-size="10">● LIVE MONITOR</text>

    <!-- Stat Cards -->
    <rect x="20" y="52" width="150" height="75" rx="6" fill="#080e15" stroke="rgba(255,255,255,0.08)"/>
    <text x="32" y="72" fill="#78837c" font-family="monospace" font-size="10">ACTIVE DISRUPTIONS</text>
    <text x="32" y="105" fill="#ff3b30" font-family="system-ui" font-size="30" font-weight="bold">12</text>
    <text x="75" y="102" fill="#ff3b30" font-family="monospace" font-size="11">↑ 3 last 24h</text>

    <rect x="185" y="52" width="150" height="75" rx="6" fill="#080e15" stroke="rgba(255,255,255,0.08)"/>
    <text x="197" y="72" fill="#78837c" font-family="monospace" font-size="10">AT RISK SHIPMENTS</text>
    <text x="197" y="105" fill="#ff9f0a" font-family="system-ui" font-size="30" font-weight="bold">08</text>
    <text x="240" y="102" fill="#ff9f0a" font-family="monospace" font-size="11">↑ 2 priority</text>

    <rect x="350" y="52" width="170" height="75" rx="6" fill="#080e15" stroke="rgba(255,255,255,0.08)"/>
    <text x="362" y="72" fill="#78837c" font-family="monospace" font-size="10">FORECASTED IMPACT</text>
    <text x="362" y="102" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="bold">Moderate</text>
    <text x="362" y="116" fill="#30d158" font-family="monospace" font-size="9">Mitigation active</text>

    <!-- Key Insights -->
    <rect x="20" y="140" width="500" height="34" rx="4" fill="rgba(255,59,48,0.08)" stroke="rgba(255,59,48,0.25)"/>
    <text x="32" y="161" fill="#ff3b30" font-family="monospace" font-size="10.5">• Cyclone forming near Bay of Bengal impacting port operations (High Risk)</text>

    <rect x="20" y="180" width="500" height="34" rx="4" fill="rgba(255,159,10,0.08)" stroke="rgba(255,159,10,0.25)"/>
    <text x="32" y="201" fill="#ff9f0a" font-family="monospace" font-size="10.5">• Political unrest in region delaying cross-border shipments (Medium Risk)</text>

    <!-- Logicure Loop Footer Bar -->
    <rect x="20" y="226" width="500" height="36" rx="6" fill="#050a10" stroke="rgba(255,107,0,0.3)"/>
    <text x="30" y="248" fill="#ff6b00" font-family="monospace" font-size="10" font-weight="bold">THE LOGICURE LOOP:</text>
    <text x="160" y="248" fill="#dfe7e0" font-family="monospace" font-size="10">SENSE → UNDERSTAND → SIMULATE → DECIDE → ACT → LEARN</text>
  </g>

  <!-- Right Side Multi-Source Intelligence Stack -->
  <g transform="translate(930, 400)">
    <rect x="0" y="0" width="305" height="280" rx="12" fill="url(#glass-dark)" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="32" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700" letter-spacing="1">MULTI-SOURCE INTELLIGENCE</text>

    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="265" height="42" rx="6" fill="#0a121c"/>
      <text x="15" y="25" fill="#dfe7e0" font-family="system-ui" font-size="11.5">🌦️ Weather &amp; Climate Telemetry</text>

      <rect x="0" y="50" width="265" height="42" rx="6" fill="#0a121c"/>
      <text x="15" y="75" fill="#dfe7e0" font-family="system-ui" font-size="11.5">📰 News &amp; Geopolitical Events</text>

      <rect x="0" y="100" width="265" height="42" rx="6" fill="#0a121c"/>
      <text x="15" y="125" fill="#dfe7e0" font-family="system-ui" font-size="11.5">🛰️ Satellite &amp; Geospatial Stream</text>

      <rect x="0" y="150" width="265" height="42" rx="6" fill="#0a121c"/>
      <text x="15" y="175" fill="#dfe7e0" font-family="system-ui" font-size="11.5">🚢 Supply Chain &amp; Trade Routes</text>
    </g>
  </g>
</svg>
